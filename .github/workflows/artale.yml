name: Artale 最新公告

on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/artale_news.py
      - run: |
          git config user.name "artale-news-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then echo "nothing new"; else git commit -m "🍊 更新 Artale 最新公告" && git push; fi
